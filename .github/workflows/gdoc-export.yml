name: "Export text to Google Doc"

# Started from the admin panel. Creates a new Google Doc (owned by the account that signed in
# with `scripts/gdoc.py login`) with the current bibliographic tables and text.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version this round of editing prepares (empty = keep the current one). Minor, e.g. 1.1: wording, corrections, references, editors. Major, e.g. 2.0: aims, tracks, targets or structure change."
        required: false
      folder:
        description: "Google Drive folder link (leave empty for the usual folder)"
        required: false

permissions:
  contents: write   # to publish the new Doc's link for the admin panel (gh-pages)

concurrency:
  group: release   # same group as the other workflows that push to gh-pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
      FOLDER: ${{ inputs.folder || vars.GDRIVE_FOLDER_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for "Based on version"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Create the Google Doc
        run: |
          set -o pipefail   # a failed export must fail the run
          # The previous export gets "NEW VERSION AVAILABLE" on top and is locked (read-only).
          git fetch -q --depth=1 origin gh-pages
          export PREVIOUS_EXPORT=$(git show FETCH_HEAD:admin/latest-export.json 2>/dev/null | jq -r '.url // empty')
          python3 scripts/gdoc.py export "$FOLDER" "$VERSION" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p panel && cp build/latest-export.json panel/

      - name: Show the new Doc on the admin panel
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: panel
          destination_dir: admin
          keep_files: true
