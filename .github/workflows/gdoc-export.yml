name: "Export text to Google Doc"

# Started from the admin panel. Creates a new Google Doc (owned by the account that signed in
# with `scripts/gdoc.py login`) with the current bibliographic tables and text.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version this round of editing prepares (empty = keep the current one). Minor, e.g. 1.1: wording, corrections, references, editors. Major, e.g. 2.0: aims, tracks, targets or structure change."
        required: false
      folder:
        description: "Google Drive folder link (leave empty for the usual folder)"
        required: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
      FOLDER: ${{ inputs.folder || vars.GDRIVE_FOLDER_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for "Based on version"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Create the Google Doc
        run: python3 scripts/gdoc.py export "$FOLDER" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
