name: "Publish release"

# Run from the admin panel after checking the Zenodo draft made by "Make a release or pre-release".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to publish, e.g. v1.2 (leave empty for the newest prepared release)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release.json and site from the GitHub release
        id: release
        run: |
          # Default: the newest release whose notes still say "DOI reserved" (prepared, not yet published).
          [ -n "$TAG" ] || TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.body | test("^DOI reserved:"; "m"))][0].tag_name // empty')
          [ -n "$TAG" ] || { echo "### No prepared release is waiting to be published." >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" -p release.json -p site.tar.gz -D build
          echo "doi=$(jq -r .doi build/release.json)" >> "$GITHUB_OUTPUT"
          echo "target=$(jq -r .target build/release.json)" >> "$GITHUB_OUTPUT"

      - name: Publish the Zenodo draft (mints the DOI)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: python3 scripts/release.py publish build/release.json

      - name: Add the DOI to the release notes
        env:
          DOI: ${{ steps.release.outputs.doi }}
        run: |
          gh release view "$TAG" --json body -q .body | grep -v '^DOI reserved:' > build/notes.md
          printf '\nVersion DOI: https://doi.org/%s (Zenodo %s)\n' "$DOI" "${{ steps.release.outputs.target }}" >> build/notes.md
          gh release edit "$TAG" --notes-file build/notes.md

      # The preview is dropped: its release candidate has just become this release.
      - name: Unpack site, keeping the admin panel and the web versions
        run: |
          mkdir _site && tar -xzf build/site.tar.gz -C _site
          git fetch -q --depth=1 origin gh-pages
          for dir in admin versions; do
            git archive FETCH_HEAD "$dir" 2>/dev/null | tar -x -C _site || echo "No /$dir/ on the site yet"
          done
          # The release's own permanent web version (linked from All versions and the PDF).
          v="${TAG#v}"; mkdir -p "_site/versions/$v" && tar -xzf build/site.tar.gz -C "_site/versions/$v"

      # Sandbox DOIs are test records, so only production releases replace the official site.
      - name: Deploy site
        if: steps.release.outputs.target == 'production'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: _site

      - name: Say what happened
        run: |
          echo "### $TAG is published" >> "$GITHUB_STEP_SUMMARY"
          echo "- DOI: https://doi.org/${{ steps.release.outputs.doi }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.release.outputs.target }}" = production ]; then
            echo "- Website updated: https://ipbes-data.github.io/IPBES_Data_Vision/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Zenodo sandbox (test) release: the website was not changed." >> "$GITHUB_STEP_SUMMARY"
          fi
