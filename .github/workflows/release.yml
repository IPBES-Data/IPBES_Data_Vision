name: Release

# A GitHub pre-release (tag v1.2-rc.1) builds without DOI and deploys to /preview/.
# A GitHub release (tag v1.2) reserves a Zenodo DOI and fills a Zenodo draft;
# the "Publish release" workflow mints it and deploys the site.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs and caches the R packages
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Build pre-release (no DOI, no Zenodo)
        if: github.event.release.prerelease
        run: python3 scripts/release.py prepare --tag "$TAG" --prerelease

      - name: Reserve DOI, build, and fill the Zenodo draft
        if: ${{ !github.event.release.prerelease }}
        env:
          ZENODO_TARGET: ${{ vars.ZENODO_TARGET }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: python3 scripts/release.py prepare --tag "$TAG"

      - name: Attach PDF, site and release.json to the GitHub release
        run: |
          tar -czf build/site.tar.gz -C _site .
          gh release upload "$TAG" build/*.pdf build/site.tar.gz build/release.json --clobber

      - name: Deploy pre-release to /preview/
        if: github.event.release.prerelease
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: _site
          destination_dir: preview
