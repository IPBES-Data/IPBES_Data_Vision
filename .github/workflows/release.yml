name: "Make a release or pre-release"

# Started from the admin panel (Actions → this workflow → Run workflow). Version numbers follow
# the rules in admin.qmd ("Version rules") and are chosen by scripts/versions.py.
# Pre-release: next release candidate (v1.1-rc.2), built without DOI, PDF archived on the GitHub
#   pre-release, site deployed to /preview/. Zenodo is not contacted.
# Release: the latest release candidate unchanged (v1.1-rc.2 → v1.1; v1.1-test.<n> while
#   ZENODO_TARGET=sandbox), DOI reserved and Zenodo draft filled; nothing public changes until
#   the "Publish release" workflow is run.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What do you want to make?"
        type: choice
        options:
          - "Pre-release (for review, no DOI)"
          - "Release (citable, with DOI)"
      notes:
        description: "What changed? Separate items with ;"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ inputs.notes }}
      PRERELEASE: ${{ startsWith(inputs.kind, 'Pre-release') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version numbers come from the tags and their commits

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Build pre-release (no DOI, no Zenodo)
        if: env.PRERELEASE == 'true'
        run: python3 scripts/release.py prepare --prerelease --notes "$NOTES"

      - name: Reserve DOI, build, and fill the Zenodo draft
        if: env.PRERELEASE != 'true'
        env:
          ZENODO_TARGET: ${{ vars.ZENODO_TARGET }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: python3 scripts/release.py prepare --notes "$NOTES"

      - name: Create the GitHub release with PDF and site attached
        run: |
          tag=$(jq -r .tag build/release.json)
          jq -r .notes build/release.json > build/notes.md
          title="Version ${tag#v}"
          if [ "$PRERELEASE" = true ]; then
            printf '\n\nPre-release for review. No DOI; not for citation.\n' >> build/notes.md
            flag=--prerelease
          else
            printf '\n\nRelease candidate %s, unchanged.\n' "$(jq -r .candidate build/release.json)" >> build/notes.md
            printf '\nDOI reserved: %s (active after "Publish release" is run)\n' "$(jq -r .doi build/release.json)" >> build/notes.md
            flag=
            if [ "$(jq -r .test build/release.json)" = true ]; then
              title="Test release ${tag#v} (Zenodo sandbox, not a version)"
              flag=--prerelease   # keeps test releases from showing as the latest release
            fi
          fi
          tar -czf build/site.tar.gz -C _site .
          gh release create "$tag" build/*.pdf build/site.tar.gz build/release.json \
            --target "$GITHUB_SHA" --title "$title" --notes-file build/notes.md $flag
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "WEB_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Deploy pre-release to /preview/
        if: env.PRERELEASE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: _site
          destination_dir: preview

      # Every pre-release also keeps a permanent web version (linked from All versions and the PDF).
      - name: Keep the web version at /versions/<version>/
        if: env.PRERELEASE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: _site
          destination_dir: versions/${{ env.WEB_VERSION }}

      - name: Say what happens next
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          if [ "$PRERELEASE" = true ]; then
            echo "### Pre-release $TAG is ready" >> "$GITHUB_STEP_SUMMARY"
            echo "- Preview: https://ipbes-data.github.io/IPBES_Data_Vision/preview/" >> "$GITHUB_STEP_SUMMARY"
            echo "- PDF and notes: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release $TAG is prepared, but not public yet" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Check the Zenodo draft: $(jq -r .draft_url build/release.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Check the PDF: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "3. If both are right, run **Publish release** from the admin panel." >> "$GITHUB_STEP_SUMMARY"
          fi
