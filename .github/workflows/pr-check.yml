name: "Check website and PDF build"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Check the version rules
        run: python3 scripts/test_versions.py

      - name: Render website and PDF (unreleased draft)
        run: python3 scripts/release.py build

      - name: Make the rendered site and PDF downloadable from the check run
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
