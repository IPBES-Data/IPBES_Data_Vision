project:
  type: website
  render:
    - IPBES_Data_Vision.qmd
    - older-releases.qmd
    - v1.0.qmd
  resources:
    - logos/ipbes-data.jpg

website:
  title: "IPBES Data Management Vision"
  navbar:
    pinned: true   # stays at the top while scrolling
    background: light
    logo: logos/ipbes-data.jpg
    logo-alt: "IPBES-Data"
    # The three main buttons sit centred and never move (styles.css); page-specific ones go on the right.
    left:
      - text: "Latest release"
        icon: book
        href: https://ipbes-data.github.io/IPBES_Data_Vision/   # always the main site, also from the preview
      - text: "Latest pre-release"
        icon: eye
        href: https://ipbes-data.github.io/IPBES_Data_Vision/preview/
      - text: "All versions"
        icon: clock-history
        href: https://ipbes-data.github.io/IPBES_Data_Vision/older-releases.html
    right:
      - text: "Download PDF"
        icon: download
        href: assets/IPBES-Data-Management-Vision-latest.pdf
        target: _blank
  page-footer:
    left: "IPBES secretariat, Bonn, Germany"
    right: "[tsu.data@ipbes.net](mailto:tsu.data@ipbes.net)"

format:
  html:
    css: styles.css
    include-after-body: nav-links.html

execute:
  echo: false
