<script>
// Header buttons whose target does not exist on this site: the PDF (e.g. the main site before 2.0) is hidden
// (it is on the right, so nothing moves); "Latest pre-release" (none since the last release) stays in place,
// greyed out, so the three centred buttons never move. Mark the current section active.
const check = (selector, page, missing) => document.querySelectorAll(selector).forEach((a) =>
  fetch(a.href + page, { method: "HEAD" }).then((r) => { if (!r.ok) missing(a); }).catch(() => {}));
check('a[href*="assets/IPBES-Data-Management-Vision-"][href$=".pdf"]', "", (a) => { a.closest("li").style.visibility = "hidden"; });
check('a[href$="/preview/"]', "index.html", (a) => { a.classList.add("unavailable"); a.title = "There is no pre-release at the moment."; });
const here = location.pathname;
document.querySelectorAll(".navbar .nav-link").forEach((a) => a.classList.remove("active"));
const mark = (selector) => document.querySelectorAll(selector).forEach((a) => a.classList.add("active"));
if (here.endsWith("older-releases.html")) mark('a[href$="older-releases.html"]');
else if (here.includes("/preview/")) mark('a[href$="/preview/"]');
else if (!here.includes("/versions/")) mark('a[href$="/IPBES_Data_Vision/"]');
</script>
